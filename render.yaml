services:
  - type: web
    name: ai-travel-planner-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: false
      - key: SECRET_KEY
        value: production-secret-key-123
